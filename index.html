<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>霓虹孤岛 NEON ISLE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles/hud.css" />
</head>
<body>
  <noscript><p class="noscript">需要启用 JavaScript 才能接入岛屿数据链。</p></noscript>

  <div id="app">
    <canvas id="scene"></canvas>

    <!-- 全屏氛围层 -->
    <div class="vignette" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <!-- 左上:雷达小地图 -->
    <section class="hud-radar" aria-label="雷达小地图">
      <div class="radar-frame">
        <canvas id="radar" width="150" height="150"></canvas>
        <div class="radar-sweep" aria-hidden="true"></div>
      </div>
      <div class="radar-tag">RADAR·02</div>
    </section>

    <!-- 右上:状态读数 -->
    <section class="hud-status" aria-label="状态信息">
      <div class="status-row">
        <span class="status-label">FPS</span>
        <span id="hud-fps" class="status-val">--</span>
      </div>
      <div class="status-row">
        <span class="status-label">POS</span>
        <span id="hud-pos" class="status-val">X --·-- · Z --·--</span>
      </div>
      <div class="status-link"></div>
    </section>

    <!-- 底部中央:键位提示 -->
    <section class="hud-keys" id="hud-keys" aria-label="操作提示">
      <span><span class="key-cap">W A S D</span>移动</span>
      <span><span class="key-cap">SHIFT</span>疾跑</span>
      <span><span class="key-cap">拖拽</span>视角</span>
      <span><span class="key-cap">E</span>交互</span>
    </section>

    <!-- 交互提示条 -->
    <div class="interact-prompt" id="interact-prompt" hidden>
      <span class="key-cap small">E</span>
      <span id="interact-name">交互</span>
    </div>

    <!-- 移动端交互按钮 -->
    <button class="touch-interact" id="touch-interact" hidden aria-label="交互">E</button>

    <!-- 对话框 -->
    <section class="dialog" id="dialog" hidden>
      <header class="dialog-head">
        <span class="dialog-chip" aria-hidden="true"></span>
        <span class="dialog-speaker" id="dialog-name">SYSTEM</span>
        <button class="dialog-close" id="dialog-close" aria-label="关闭对话">✕</button>
      </header>
      <p class="dialog-text" id="dialog-text"></p>
      <footer class="dialog-footer">
        <span class="dialog-hint">按 <span class="key-cap small">E</span> / 点触 继续</span>
      </footer>
    </section>

    <!-- 虚拟摇杆 -->
    <div class="joystick" id="joystick" aria-label="移动摇杆">
      <div class="joy-base">
        <div class="joy-ring"></div>
        <div class="joy-cross" aria-hidden="true"></div>
      </div>
      <div class="joy-knob" id="joy-knob"></div>
    </div>

    <!-- 左下水印 -->
    <div class="hud-logo" aria-hidden="true">
      <div class="logo-main">NEON·ISLE</div>
      <div class="logo-sub">3D EXPLORATION DECK // v0.1 DBG</div>
    </div>

    <!-- 加载遮罩 -->
    <div class="loader" id="loader">
      <div class="loader-core">
        <div class="loader-ring" aria-hidden="true"></div>
        <p class="loader-text">INITIALIZING ISLAND LINK</p>
        <p class="loader-sub" id="loader-sub">正在接入列岛数据流…</p>
      </div>
    </div>

    <!-- 致命错误提示 -->
    <div class="fatal" id="fatal" hidden>
      <div class="fatal-panel">
        <p class="fatal-title">LINK FAILED</p>
        <p class="fatal-msg" id="fatal-msg">系统链接失败</p>
        <p class="fatal-sub">请检查网络与浏览器是否能访问 CDN 后刷新重试</p>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three.module.js"
    }
  }
  </script>
  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
