<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15110d" />
    <title>废土场景 · 模型预览</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e08a3c'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <noscript><p class="noscript">需要启用 JavaScript 才能加载模型。</p></noscript>

    <canvas id="scene" aria-label="废土场景三维模型预览"></canvas>

    <!-- 加载遮罩：模型下载完成后淡出 -->
    <div class="loading" id="loading" role="status" aria-live="polite">
      <div class="loading-bar"><i id="loading-bar-fill"></i></div>
      <p class="loading-text">加载模型 <span id="loading-pct">0%</span></p>
    </div>

    <p class="hint">
      WASD 移动 · Shift 奔跑 · 空格 跳跃 · C 下蹲 · X 静步 · 左键 拳击四段 · 右键 格挡 · 拖拽转视角
    </p>

    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
